name: Deploy to Cloudflare Workers

# Auto-deploy on every push to main. The build is done here (OpenNext),
# then handed to Cloudflare via wrangler.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN            — a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID           — the DDC account id
#   NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY — inlined into the client bundle at build time
#                                      (mirrors .env.local, which is gitignored)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys race; cancel an in-flight run when a newer push lands.
concurrency:
  group: deploy-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
